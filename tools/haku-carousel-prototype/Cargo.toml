[package]
name = "haku-carousel-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["canvas", "image-without-codecs", "tokio", "wayland", "advanced"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "=1.0.149"
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "process"] }
log = "0.4"
libc = "=0.2.190"
iced_layershell = { version = "=0.19.1", default-features = false, optional = true }
notify = { version = "8", optional = true }

[[bin]]
name = "haku-carousel"
path = "src/full.rs"
required-features = ["full"]

[[bin]]
name = "haku-carousel-prototype"
path = "src/main.rs"

[features]
default = ["software"]
software = ["iced/tiny-skia"]
gpu = ["iced/wgpu"]
full = ["gpu", "dep:iced_layershell", "dep:notify"]

[profile.release]
opt-level = 2
strip = true
