source = ~/.local/state/haku_theme/hyprland-style.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

animations {
    enabled = true
    bezier = haku, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 0.35, haku
    animation = fadeOut, 1, 0.22, haku
    animation = inputFieldDots, 1, 0.18, haku
    animation = inputFieldColors, 1, 0.2, haku
    animation = inputFieldWidth, 1, 0.24, haku
}

background {
    monitor = 
    path = ~/.local/state/haku_theme/lockscreen-background.png
    blur_passes = 0
    contrast = 1.0
    brightness = 0.82
}

shape {
    monitor =
    size = 440, 440
    color = rgba(5, 7, 10, 0.42)
    rounding = 24
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $accent_color
    font_size = 54
    font_family = $font_family ExtraBold
    position = 0, 154
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(235, 238, 244, 0.76)
    font_size = 15
    font_family = $font_family
    position = 0, 106
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = CALLI
    color = $accent_color
    font_size = 16
    font_family = $font_family ExtraBold
    position = 0, -48
    halign = center
    valign = center
    zindex = 5
}

image {
    monitor =
    path = ~/Pictures/fastfetch-icon/icon.png
    size = 82
    rounding = -1
    border_size = 2
    border_color = $accent_color
    position = 0, 18
    halign = center
    valign = center
    zindex = 5
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    outer_color = $accent_color
    inner_color = rgba(255, 255, 255, 0.06)
    font_color = rgba(245, 247, 250, 0.92)
    dots_size = 0.38
    dots_spacing = 0.05
    dots_center = true
    dots_rounding = -1
    dots_fade_time = 130
    dots_text_format =●
    fade_on_empty = false
    placeholder_text = <i>Contraseña</i>
    hide_input = false
    fail_color = rgba(224, 108, 117, 0.85)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -124
    halign = center
    valign = center
    zindex = 10
}
