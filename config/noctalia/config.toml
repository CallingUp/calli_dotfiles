
[accessibility]
ui_scale = 0.9

[bar.default]
center = [ "workspaces", "spacer_1", "active_window" ]
concave_edge_corners = true
end = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "session" ]
margin_edge = 0
margin_ends = 20
radius_bottom_left = 20
radius_bottom_right = 20
radius_top_left = 20
radius_top_right = 20
scale = 1.15
start = [ "launcher", "clock", "spacer_1", "group:g1" ]
thickness = 20

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 0.0
    padding =6.0

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
# A transparent 1px Noctalia bar is kept behind Waybar solely as the native
# anchor for the control-center reveal. It prevents a visible second band.
panel_anchor_bar = "default"

    [shell.greeter_sync]
    auto_sync = false

    [shell.animation]
    enabled = true
    # Keep panel movement intentional and continuous with the Waybar capsule.
    speed = 0.85

    [shell.panel]
    # Waybar is the visual header: remove the panel's own outline and shadow so
    # both surfaces read as one continuous capsule.
    borders = false
    shadow = false
    floating_offset = 0
    launcher_placement = "floating"
    launcher_position = "auto"
    control_center_placement = "attached"
    # The contextual Waybar capsule is centered; opening at the pointer makes
    # the panel look offset whenever the trigger is clicked near an edge.
    control_center_position = "auto"
    open_near_click_control_center = false
    open_near_click_launcher = true
    session_placement = "floating"
    session_position = "top_right"
    open_near_click_session = true

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [shell.session]
    grid = true
    grid_columns = 1
    show_shortcuts = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[control_center]
sidebar = "compact"
sidebar_section = "none"
hidden_tabs = [ "calendar", "weather" ]

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "custom"
custom_palette = "haku-dynamic"
pure_black_dark = true
[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.asus_fan]
type = "kv7499/asus-fan:asus_fan"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false

[bar.default.monitor.eDP-1]
# The attached panel applies the bar margin itself; keep the invisible anchor at
# the top edge so its reveal begins directly under Waybar.
enabled = true
layer = "overlay"
reserve_space = false
background_opacity = 0.0
thickness = 1
margin_edge = 0
margin_ends = 0
padding = 0
start = []
center = []
end = []
shadow = false
contact_shadow = false
# Let the panel overlap the transparent anchor enough to erase the seam with
# Waybar while keeping both surfaces input-safe.
panel_overlap = 0

[wallpaper]
enabled = false

[weather]
enabled = false
